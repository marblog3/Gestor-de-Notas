<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login y Registro</title>
  <link rel="website icon" type="png" href="..\img\logo.png">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/principal.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<header class="mi-header">
  <div class="header-left1">
    <img src="../img/logo.png" alt="Logo" class="header-logo1">
    <h1 class="header-title1">E.E.S.T.N°5</h1>
  </div>
</header>

<body>

  <div class="main-container">

    <div class="image-column">
      <img src="..\img\d12245cc-1680-458d-89dd-4f0d7fb22724.png" alt="Imagen de bienvenida">
    </div>

    <div class="form-column">

      <div class="form-wrapper" id="login-container">
        <h2>Iniciar Sesión</h2>
        <p class="form-subtitle">Bienvenido al Sistema de Gestión de Notas.</p>
        <div id="error-msg" class="error"></div>

        <div class="input-group">
          <input type="email" id="login-username" placeholder=" " required>
          <label for="login-username">Correo institucional</label>
        </div>

        <div class="input-group">
          <input type="password" id="login-password" placeholder=" " required>
          <label for="login-password">Contraseña</label>
        </div>

        <button class="btn-primary" onclick="login()"><b>Iniciar Sesión</b></button>

        <div class="switch">
          <a href="olvidaste_contrasena.html" class="form-link">
            <b>¿Olvidaste tu Contraseña?</b>
          </a>
        </div>

        <div class="google-login-container">
          <div id="g_id_onload"
            data-client_id="1016546675395-j3p58ugrpdhnb1pfa25m2jichtt4a4pt.apps.googleusercontent.com"
            data-context="signin" data-ux_mode="popup" data-callback="handleGoogleCredentialResponse"
            data-auto_prompt="false">
          </div>
          <div class="g_id_signin" data-type="standard"></div>
        </div>

        <div class="switch">
          <b>¿No tienes cuenta?</b> <a href="javascript:void(0)" onclick="showRegister()"
            class="form-link"><b>Registrate</b></a>
        </div>
      </div>

      <div class="form-wrapper" id="register-container" style="display: none;">
        <h2>Registrar Usuario</h2>
        <p class="form-subtitle">Completa tus datos para crear una cuenta.</p>
        <div id="register-error-msg" class="error"></div>

        <div class="input-group">
          <input type="text" id="register-fullname" placeholder=" " required>
          <label for="register-fullname">Nombre y Apellido</label>
        </div>

        <div class="input-group">
          <input type="text" id="register-dni" placeholder=" " required>
          <label for="register-dni">DNI</label>
        </div>

        <div class="input-group">
          <input type="email" id="register-username" placeholder=" " required>
          <label for="register-username">Correo institucional (@eest5.com)</label>
        </div>

        <button class="btn-primary" onclick="register()"><b>Registrar</b></button>

        <div class="switch">
          <b>¿Ya tienes cuenta?</b> <a href="javascript:void(0)" onclick="showLogin()" class="form-link"><b>Iniciar
              Sesión</b></a>
        </div>
      </div>

    </div>
  </div>

  <div id="custom-alert-overlay" class="modal-overlay">
    <div class="modal-box">
      <p id="custom-alert-message"></p>
    </div>
  </div>

  <script src="../js/global.js"></script>
  <script src="../js/principal.js"></script>


</html>
